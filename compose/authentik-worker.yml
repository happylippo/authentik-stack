services:
  authentik-worker:
    container_name: ${SERVICES_WORKER_CONTAINER_NAME:-authentik-worker}
    command: worker
    depends_on:
      authentik-database:
        condition: service_healthy
      authentik-socket-proxy:
        condition: service_started
    env_file: ${ABSOLUTE_PATH}/.env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-database
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?database password required}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      DOCKER_HOST: tcp://authentik-socket-proxy:2375
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.5}
    restart: unless-stopped
    shm_size: 512mb
    user: root
    volumes:
      - ${ABSOLUTE_PATH}/data:/data
      - ${ABSOLUTE_PATH}/certs:/certs
      - ${ABSOLUTE_PATH}/custom-templates:/templates
      - ${ABSOLUTE_PATH}/blueprints:/blueprints/custom
    networks:
      authentik:
        ipv4_address: ${SERVICES_WORKER_IPV4:-172.30.0.3}
        ipv6_address: ${SERVICES_WORKER_IPV6:-fd00:dead:beef:f0::3}
      authentik-socket:
        ipv4_address: ${SERVICES_WORKER_SOCKET_IPV4:-172.30.1.3}
        ipv6_address: ${SERVICES_WORKER_SOCKET_IPV6:-fd00:dead:beef:f1::3}
