# Vorlage: Diese Datei in das von Traefiks file-Provider überwachte
# Konfigurationsverzeichnis kopieren und Traefik neu laden.
http:
  middlewares:
    authentik:
      forwardAuth:
        address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
          # Nur aktivieren, wenn der Proxy-Provider HTTP Basic Authentication sendet:
          # - authorization
